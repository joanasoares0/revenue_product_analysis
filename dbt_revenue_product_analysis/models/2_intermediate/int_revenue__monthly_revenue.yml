version: 2

models:
  - name: int_revenue__monthly_revenue
    description: Monthly revenue metrics including MRR, growth rates, and user counts.
    columns:
      - name: payment_month
        description: The month of payment in yyyyMM format.
      - name: total_revenue
        description: Total revenue collected in the month.
      - name: total_mrr
        description: Total monthly recurring revenue.
      - name: paying_users
        description: Number of unique paying users.
      - name: avg_payment_amount
        description: Average payment amount.
      - name: prev_month_mrr
        description: MRR from the previous month.
      - name: mrr_growth_pct
        description: Percentage growth in MRR month-over-month.