version: 2

models:
  - name: stg_revenue__plans
    description: Staging model for raw plan definitions loaded from seed data.
    columns:
      - name: plan_id
        description: A unique identifier for the plan.
        data_tests:
          - unique
          - not_null
      - name: sk_plan_id
        description: Surrogate key for the plan.
        data_tests:
          - unique
          - not_null
      - name: plan_name
        description: "The name of the plan (normalized: lowercase, trimmed, underscores replaced with spaces)."
      - name: monthly_price
        description: The monthly price of the plan.
        data_tests:
          - not_null
      - name: annual_price
        description: The annual price of the plan.
        data_tests:
          - not_null
      - name: tier
        description: The tier level of the plan.
      - name: max_seats
        description: The maximum number of seats allowed for the plan.
      - name: features
        description: "The features included in the plan (normalized: lowercase, trimmed, underscores replaced with spaces)."
      - name: _stg_loaded_at
        description: Timestamp when the record was loaded into staging.