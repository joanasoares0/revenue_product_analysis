# CD workflow — runs automatically when a PR is merged into main.
#
# Goal: deploy the validated, merged changes to the production Databricks database
# and publish a fresh manifest so the next CI run can do a fast, stateful comparison.
#
# Strategy — stateful prod deploy:
#   1. Download the manifest.json from the previous successful CD run.
#   2. Use `dbt build -s state:modified+` to rebuild only what changed since last deploy.
#   3. Upload the new manifest.json as a GitHub artifact so the CI workflow can use it
#      on the next PR to run slim CI (state:modified+ with --defer).
#   4. If no previous manifest exists (first-ever deploy), fall back to a full build.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   DB_HOST_PROD        — Databricks workspace hostname for the prod cluster
#   DB_HTTP_PATH_PROD   — HTTP path of the prod SQL warehouse / cluster
#   DB_TOKEN_PROD       — Personal access token (or service principal token) for prod

name: CD

on:
  push:
    branches: [main]

jobs:
  CD_job:
    runs-on: ubuntu-latest

    # All `run` steps execute from the dbt project subdirectory so that dbt
    # picks up dbt_project.yml, profiles.yml, and packages without extra flags.
    defaults:
      run:
        working-directory: ./dbt_revenue_product_analysis

    env:
      # Databricks connection — read from repo secrets so credentials are never
      # stored in plain text. These map directly to env_var() calls in profiles.yml.
      DB_HOST_PROD: ${{ secrets.DB_HOST_PROD }}
      DB_HTTP_PATH_PROD: ${{ secrets.DB_HTTP_PATH_PROD }}
      DB_TOKEN_PROD: ${{ secrets.DB_TOKEN_PROD }}

      # Name used to store/retrieve the manifest artifact between workflow runs.
      # Must match the name used in the CI download step.
      MANIFEST_ARTIFACT_NAME: dbt-manifest

      DBT_TARGET: prod

    steps:
      # ── 1. SOURCE CODE ────────────────────────────────────────────────────────
      - name: Checkout repository
        # Clones main at the commit that was just merged so all dbt files are
        # up to date before we deploy to prod.
        uses: actions/checkout@v4

      # ── 2. PYTHON ENVIRONMENT ─────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (dbt-databricks)
        # requirements.txt pins dbt-databricks so the prod adapter version matches
        # what was tested in CI.
        run: pip install -r requirements.txt

      # ── 3. FETCH PREVIOUS MANIFEST FOR STATEFUL BUILD ─────────────────────────
      - name: Download latest manifest artifact
        # The previous CD run uploaded manifest.json as an artifact. We download it
        # here to compare the current compiled graph against the last deployed state,
        # so we can rebuild only the models that changed (state:modified+).
        # `continue-on-error: true` handles the first-ever deploy gracefully —
        # there is no previous artifact yet, so we fall back to a full build.
        continue-on-error: true
        shell: bash
        run: |
          echo "Fetching artifact list from GitHub API..."
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts" \
              -o artifacts.json

          # Parse the numeric artifact ID from the JSON response.
          artifact_id=$(grep -A10 '"name": "${{ env.MANIFEST_ARTIFACT_NAME }}"' artifacts.json \
            | grep '"archive_download_url":' \
            | head -n1 \
            | sed 's/.*artifacts\/\([0-9]*\)\/zip.*/\1/')

          if [ -z "$artifact_id" ]; then
            echo "No '${{ env.MANIFEST_ARTIFACT_NAME }}' artifact found — will run a full build."
            exit 0
          fi

          echo "Found artifact ID: $artifact_id — downloading..."
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" \
              -o artifact.zip

          unzip -q artifact.zip -d state
          echo "Manifest extracted to ./state/"

      - name: Resolve build mode (stateful vs full)
        # If the manifest download succeeded, copy it to ./manifest.json so the
        # dbt build step can reference it. If not, the build step will do a full run.
        run: |
          if [ -f "./state/manifest.json" ]; then
            cp ./state/manifest.json ./manifest.json
            echo "manifest.json found — stateful deploy enabled (state:modified+)"
          else
            echo "No manifest.json — stateful deploy not available, running full build"
          fi

      # ── 4. DBT PIPELINE ───────────────────────────────────────────────────────
      - name: dbt debug
        # Validates the connection to the prod Databricks cluster and confirms that
        # dbt can read the project config. Fails fast if credentials are wrong.
        run: dbt debug --target $DBT_TARGET --profiles-dir .

      - name: dbt deps
        # Installs dbt packages declared in packages.yml (e.g. dbt_utils).
        run: dbt deps --target $DBT_TARGET --profiles-dir .

      - name: dbt build
        # Stateful path — if a previous manifest is available, build only the models
        #                 that changed since the last prod deploy (state:modified+),
        #                 plus all their downstream dependents. Much faster than a
        #                 full rebuild on large projects.
        # Full path     — no manifest available; build and test everything from scratch.
        run: |
          if [ -f "./manifest.json" ]; then
            echo "Running stateful deploy: state:modified+"
            dbt build -s 'state:modified+' --state ./state \
              --target $DBT_TARGET --profiles-dir .
          else
            echo "Running full build"
            dbt build --target $DBT_TARGET --profiles-dir .
          fi

      # ── 5. PUBLISH MANIFEST FOR NEXT CI/CD RUN ───────────────────────────────
      - name: Upload new manifest artifact
        # Saves the manifest.json produced by this deploy as a GitHub artifact.
        # The CI workflow downloads this manifest on the next PR so it can compare
        # what changed and run a slim build (state:modified+ with --defer).
        # The CD workflow also downloads it on the next merge to do a stateful deploy.
        # retention-days: 30 ensures the manifest is available for rollbacks within a month.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MANIFEST_ARTIFACT_NAME }}
          path: ./dbt_revenue_product_analysis/target/manifest.json
          if-no-files-found: error
          retention-days: 30
