# CI workflow — runs on every pull request targeting main.
#
# Goal: validate that the changes in this PR don't break any dbt models or tests
# before they are merged into production.
#
# Strategy — slim CI with state comparison:
#   1. Download the manifest.json that was produced by the last successful CD run on main.
#   2. Use `dbt build -s state:modified+` to build only the models that changed in this PR
#      plus all their downstream dependents. This makes CI fast even on large projects.
#   3. Use `--defer` so any model NOT selected in step 2 is resolved against the prod
#      database instead of being rebuilt — tests on unchanged upstream models still pass.
#   4. If no manifest exists yet (first-ever run), fall back to a full `dbt build`.
#
# Each PR gets its own isolated schema in Databricks:
#   ci_revenue_product_analysis.<PR_NUMBER>__<SHORT_SHA>
# This prevents concurrent PRs from stepping on each other's tables.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   DB_HOST_CI        — Databricks workspace hostname for the CI cluster
#   DB_HTTP_PATH_CI   — HTTP path of the CI SQL warehouse / cluster
#   DB_TOKEN_CI       — Personal access token (or service principal token) for CI

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  CI_job:
    runs-on: ubuntu-latest

    # All `run` steps execute from the dbt project subdirectory so that dbt
    # picks up dbt_project.yml, profiles.yml, and packages without extra flags.
    defaults:
      run:
        working-directory: ./dbt_revenue_product_analysis

    env:
      # Databricks connection — read from repo secrets so credentials are never
      # stored in plain text. These map directly to env_var() calls in profiles.yml.
      DB_HOST_CI: ${{ secrets.DB_HOST_CI }}
      DB_HTTP_PATH_CI: ${{ secrets.DB_HTTP_PATH_CI }}
      DB_TOKEN_CI: ${{ secrets.DB_TOKEN_CI }}

      # SCHEMA_PREFIX is read by profiles.yml via env_var('SCHEMA_PREFIX', 'PR').
      # Combined with schema_id it produces: PR_<number>__<sha>
      SCHEMA_PREFIX: PR

      DBT_TARGET: ci

      # Name used to store/retrieve the manifest artifact between workflow runs.
      # Must match the name used in the CD upload step.
      MANIFEST_ARTIFACT_NAME: dbt-manifest

    steps:
      # ── 1. SOURCE CODE ────────────────────────────────────────────────────────
      - name: Checkout repository
        # Clones the PR branch so all dbt files reflect the proposed changes.
        uses: actions/checkout@v4

      # ── 2. PYTHON ENVIRONMENT ─────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (dbt-databricks)
        # requirements.txt pins dbt-databricks so the CI adapter version matches
        # what was tested locally.
        run: pip install -r requirements.txt

      # ── 3. PR-SCOPED SCHEMA ───────────────────────────────────────────────────
      - name: Build schema ID
        # Produces a unique schema suffix for this exact PR commit, e.g. 42__A1B2C3D.
        # This value is injected into dbt via --vars and consumed by profiles.yml,
        # ensuring each PR build lands in its own isolated schema in Databricks.
        run: |
          echo "SCHEMA_ID=${{ github.event.pull_request.number }}__$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7 | tr '[:lower:]' '[:upper:]')" >> $GITHUB_ENV
          echo "Schema ID: $SCHEMA_ID"

      # ── 4. FETCH MAIN'S MANIFEST FOR SLIM CI ─────────────────────────────────
      - name: Download latest manifest artifact
        # The CD pipeline uploads manifest.json after every successful prod deploy.
        # We fetch it here so we can compare it against the PR's compiled graph
        # and build only what changed (state:modified+).
        # `continue-on-error: true` means a missing artifact (first-ever run, or
        # after a gap) doesn't abort the job — we fall back to a full build instead.
        continue-on-error: true
        shell: bash
        run: |
          echo "Fetching artifact list from GitHub API..."
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts" \
              -o artifacts.json

          # Parse the numeric artifact ID from the JSON response.
          artifact_id=$(grep -A10 '"name": "${{ env.MANIFEST_ARTIFACT_NAME }}"' artifacts.json \
            | grep '"archive_download_url":' \
            | head -n1 \
            | sed 's/.*artifacts\/\([0-9]*\)\/zip.*/\1/')

          if [ -z "$artifact_id" ]; then
            echo "No '${{ env.MANIFEST_ARTIFACT_NAME }}' artifact found — will run a full build."
            exit 0
          fi

          echo "Found artifact ID: $artifact_id — downloading..."
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" \
              -o artifact.zip

          unzip -q artifact.zip -d state
          echo "Manifest extracted to ./state/"

      - name: Resolve build mode (slim vs full)
        # If the manifest download succeeded, copy it to ./manifest.json so the
        # dbt build step can reference it. If not, the build step will do a full run.
        run: |
          if [ -f "./state/manifest.json" ]; then
            cp ./state/manifest.json ./manifest.json
            echo "manifest.json found — slim CI enabled (state:modified+ with --defer)"
          else
            echo "No manifest.json — slim CI not available, running full build"
          fi

      # ── 5. DBT PIPELINE ───────────────────────────────────────────────────────
      - name: dbt debug
        # Validates the connection to Databricks and confirms that dbt can read
        # the project config and profiles. Fails fast if credentials are wrong.
        run: |
          dbt debug --target $DBT_TARGET --profiles-dir . --vars "schema_id: $SCHEMA_ID"

      - name: dbt deps
        # Installs dbt packages declared in packages.yml (e.g. dbt_utils).
        run: dbt deps --target $DBT_TARGET --profiles-dir .

      - name: dbt build
        # Slim path  — if a manifest is available, only build models that changed
        #              in this PR plus their downstream dependents (state:modified+).
        #              --defer resolves refs to unchanged models against prod,
        #              so tests on upstream tables still pass without rebuilding them.
        # Full path  — no manifest available; build and test every model from scratch.
        run: |
          if [ -f "./manifest.json" ]; then
            echo "Running slim CI: state:modified+ with --defer"
            dbt build -s 'state:modified+' --defer --state ./state \
              --target $DBT_TARGET --profiles-dir . --vars "schema_id: $SCHEMA_ID"
          else
            echo "Running full build"
            dbt build --target $DBT_TARGET --profiles-dir . --vars "schema_id: $SCHEMA_ID"
          fi
